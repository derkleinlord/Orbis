services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-orbis}
      MARIADB_USER: ${DB_USER:-orbis}
      MARIADB_PASSWORD: ${DB_PASSWORD:-orbis-dev-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-orbis-root-dev-password}
    ports:
      - "3306:3306"
    volumes:
      - orbis_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4010
      DB_HOST: mariadb
      FRONTEND_ORIGIN: http://localhost:8080
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "4010:4010"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  orbis_mariadb:
